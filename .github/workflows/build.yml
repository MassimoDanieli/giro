name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Cache JUCE
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: juce-8.0.17-${{ runner.os }}
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log
      - name: Build
        run: cmake --build build --config Release --target Giro giro_tests giro_ireal_tests giro_engine_test -j4 2>&1 | tee build.log
      # Surface compiler errors as annotations, readable without opening the log.
      - name: Report errors
        if: failure()
        run: |
          cat configure.log build.log 2>/dev/null | grep -E "(error|Error)[: ]" | head -15 | sed 's/^/::error::/' || true
      - name: Test
        run: cd build && ctest --output-on-failure
      - name: Package
        run: cd build/Giro_artefacts/Release && ditto -c -k --keepParent Giro.app Giro-mac.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Giro-mac
          path: build/Giro_artefacts/Release/Giro-mac.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache JUCE
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: juce-8.0.17-${{ runner.os }}
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libcurl4-openssl-dev libgl-dev
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Giro giro_tests giro_ireal_tests giro_engine_test -j4 && cd build && ctest --output-on-failure

  # Core tests under AddressSanitizer + UBSan (no JUCE needed): catches
  # out-of-bounds reads in the MIDI / iReal parsers, which read untrusted files.
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Core tests with ASan/UBSan
        run: |
          FLAGS="-std=c++17 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          g++ $FLAGS -o core_tests tests/test_core.cpp core/*.cpp && ./core_tests
          g++ $FLAGS -o ireal_tests tests/test_ireal.cpp core/*.cpp && (cd tests && ../ireal_tests)
